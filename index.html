<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Rescue Mission</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
    font-family:'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #161616, #050505);
    color:#fff;
    min-height:100vh;
}

/* LOGIN */
#loginScreen{
    position:fixed; inset:0;
    display:flex; justify-content:center; align-items:center;
    padding:20px;
}
.login-card{
    width:100%; max-width:450px;
    background:#111;
    border:1px solid #b30000;
    border-radius:18px;
    padding:35px; text-align:center;
    box-shadow:0 0 25px rgba(255,0,0,.35);
}
.login-card h1{ color:#ff4444; margin-bottom:15px; }
.login-card p{ color:#ccc; margin-bottom:20px; }
input{
    width:100%; padding:15px; border:none; border-radius:10px;
    background:#1d1d1d; color:#fff; font-size:20px; text-align:center;
    letter-spacing:2px; outline:none;
}
button{
    width:100%; margin-top:15px; padding:15px; border:none;
    border-radius:10px; background:#b80000; color:#fff;
    font-weight:bold; font-size:16px; cursor:pointer; transition:.3s;
}
button:hover{ background:#d60000; }
#error{ display:none; color:#ff6666; margin-top:15px; }

/* CONTENT */
#missionPage{ display:none; min-height:100vh; padding:30px 20px; }
.header{ text-align:center; margin-bottom:25px; }
.header h1{ color:#ff4444; margin-bottom:10px; }
.header p{ color:#bdbdbd; }
.image-container{ display:flex; justify-content:center; }
#letterImage{
    width:100%; max-width:1200px; height:auto; display:block;
    border-radius:12px; box-shadow:0 0 40px rgba(255,0,0,.25);
}
.footer-text{ text-align:center; margin-top:20px; color:#999; font-size:14px; }
</style>
</head>

</div>

<script>
const ACCESS_CODE = "85432";

function checkCode(){
    const entered = document.getElementById("passcode").value.trim();
    if(entered === ACCESS_CODE){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("missionPage").style.display = "block";
        sessionStorage.setItem("missionUnlocked","true");
    } else {
        document.getElementById("error").style.display = "block";
    }
}

window.onload = function(){
    if(sessionStorage.getItem("missionUnlocked") === "true"){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("missionPage").style.display = "block";
    }
};
</script>
