<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agent Rescue Mission</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    background:
        radial-gradient(circle at top, #1a1a1a, #050505);
    color:white;
    min-height:100vh;
}

/* LOGIN SCREEN */
#loginScreen{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:rgba(15,15,15,.92);
    border:1px solid #9e0000;
    border-radius:18px;
    padding:35px;
    text-align:center;
    box-shadow:
    0 0 25px rgba(255,0,0,.25),
    inset 0 0 30px rgba(255,255,255,.03);
}

.login-card h1{
    color:#ff4444;
    margin-bottom:10px;
    font-size:28px;
}

.login-card p{
    color:#ccc;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:none;
    outline:none;
    background:#1e1e1e;
    color:white;
    text-align:center;
    font-size:20px;
    letter-spacing:2px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#c20f0f;
    color:white;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#e61818;
}

#error{
    color:#ff6666;
    margin-top:15px;
    display:none;
}

/* MISSION PAGE */
#missionPage{
    display:none;
    min-height:100vh;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:#ff4444;
    margin-bottom:10px;
}

.header p{
    color:#bbb;
}

.image-container{
    display:flex;
    justify-content:center;
    align-items:center;
}

.image-container img{
    width:100%;
    max-width:1000px;
    border-radius:18px;
    box-shadow:
        0 0 40px rgba(255,0,0,.3);
}

.footer-text{
    text-align:center;
    margin-top:25px;
    color:#9c9c9c;
    font-size:14px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-card">

        <h1>🔒 SECURE ACCESS</h1>

        <p>
            Extraction Team Authentication Required
        </p>

        <input
            type="password"
            id="passcode"
            placeholder="Enter Access Code"
        >

        <button onclick="checkCode()">
            ACCESS TRANSMISSION
        </button>

        <div id="error">
            Invalid Passcode
        </div>

    </div>

</div>

<!-- CONTENT -->

<div id="missionPage">

    <div class="header">
        <h1>CLASSIFIED DIRECTOR TRANSMISSION</h1>
        <p>Mission Briefing Successfully Decrypted</p>
    </div>

    <div class="image-container">
        <img src="assets/boss-letter.png" alt="Missionass="footer-text">
        Agent Rescue Mission - Confidential Intelligence
    </div>

</div>

<script>

const ACCESS_CODE = "85432";

function checkCode(){

    const entered =
        document.getElementById("passcode").value.trim();

    if(entered === ACCESS_CODE){

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("missionPage").style.display = "block";

        sessionStorage.setItem("missionUnlocked","true");

    }
    else{

        document.getElementById("error").style.display = "block";

    }
}

window.onload = () => {

    if(sessionStorage.getItem("missionUnlocked") === "true"){

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("missionPage").style.display = "block";

    }

}

</script>

</body>
</html>
